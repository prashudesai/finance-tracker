name: Validate staged finance release (full, on demand)

# Full pre-release validation is available on demand; intermediate commits on
# temporary staging branches no longer restart the same comprehensive suite.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node with npm cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Verify reproducible generated files
        run: node tests/build-layout.cjs
      - name: Cache Playwright Chromium binaries
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium Linux dependencies
        run: npx playwright install-deps chromium
      - name: Download Chromium when not cached
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Browser regression suite (includes Cash Flow and Finance Insights)
        run: npm run test:emerald
      - name: PWA browser and offline tests
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/pwa-release-check.log"
          if npm run test:pwa 2>&1 | tee "$log_file"; then
            exit 0
          fi
          # Intermittent Chromium service-worker controllerchange delay: retry
          # only the known 30-second update timeout, and still fail if it persists.
          if ! grep -q 'page.waitForFunction: Timeout 30000ms exceeded.' "$log_file"; then
            exit 1
          fi
          echo "::warning::Retrying the PWA update timeout once in a fresh browser session."
          npm run test:pwa
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Finance and application tests
        run: npm test
