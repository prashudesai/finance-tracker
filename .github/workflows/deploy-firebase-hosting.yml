name: Test and deploy Firebase Hosting

on:
  push:
    branches:
      - main
    # Editing CI/docs only must not redeploy an unchanged application.
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and previous commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Choose safe validation lane
        id: lane
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only -z "$BEFORE" "$GITHUB_SHA" | node .github/scripts/release-lane.cjs
          else
            # Manual/unknown-range releases always get full checks and rules deploy.
            node .github/scripts/release-lane.cjs --full
          fi

      - name: Verify release classifier safety
        run: node .github/scripts/release-lane.cjs --self-test

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Build production Hosting files
        run: npm run build

      - name: Check deterministic generated files
        run: node tests/build-layout.cjs

      - name: Cache Playwright Chromium binaries
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium Linux dependencies
        run: npx playwright install-deps chromium

      - name: Download Chromium when not cached
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Quick mobile browser checks for style-only changes
        if: steps.lane.outputs.visual_only == 'true'
        run: |
          npm run test:cash-flow
          node tests/finance-insights-browser.cjs

      - name: Full browser regression tests for application changes
        if: steps.lane.outputs.visual_only != 'true'
        run: npm run test:emerald

      - name: Installed-PWA offline and update tests
        if: steps.lane.outputs.visual_only != 'true'
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/pwa-release-check.log"
          if npm run test:pwa 2>&1 | tee "$log_file"; then
            exit 0
          fi
          # Intermittent Chromium service-worker controllerchange delay: retry
          # only the known 30-second update timeout, and still fail if it persists.
          if ! grep -q 'page.waitForFunction: Timeout 30000ms exceeded.' "$log_file"; then
            exit 1
          fi
          echo "::warning::Retrying the PWA update timeout once in a fresh browser session."
          npm run test:pwa

      - name: Set up Java for Firestore emulator
        if: steps.lane.outputs.visual_only != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Firestore security and concurrent reviews tests
        if: steps.lane.outputs.visual_only != 'true'
        run: npm run test:rules

      - name: Full finance and application regression tests
        if: steps.lane.outputs.visual_only != 'true'
        run: npm test

      - name: Check Firebase credentials are configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 repository secret before deploying."
            exit 1
          fi

      - name: Deploy Firestore rules only when rules or Firebase config changed
        if: steps.lane.outputs.rules_changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
        run: |
          credentials_path="$(mktemp)"
          trap 'rm -f "$credentials_path"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" npx firebase deploy --only firestore:rules --project finance-tracker-bc7c9 --non-interactive

      # The legacy-vault deletion screen requires a callable function. Deploy it
      # before Hosting so production never shows an unusable destructive action.
      - name: Install Cloud Functions dependencies
        if: steps.lane.outputs.functions_changed == 'true'
        run: npm ci --prefix functions --ignore-scripts

      - name: Deploy account deletion Cloud Function before Hosting
        if: steps.lane.outputs.functions_changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
        run: |
          credentials_path="$(mktemp)"
          trap 'rm -f "$credentials_path"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" npx firebase deploy --only functions:tracker-account --project finance-tracker-bc7c9 --non-interactive

      - name: Deploy Hosting to production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
          projectId: finance-tracker-bc7c9
          channelId: live
          firebaseToolsVersion: 15.34.0
