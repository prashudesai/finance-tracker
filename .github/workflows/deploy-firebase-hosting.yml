name: Test and deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:emerald

      - name: Run regression tests
        run: npm test

      - name: Check Firebase credentials are configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 repository secret before deploying."
            exit 1
          fi

      - name: Deploy Hosting to production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_TRACKER_BC7C9 }}
          projectId: finance-tracker-bc7c9
          channelId: live
          firebaseToolsVersion: 15.34.0
